name: Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Subtitle source branch or exact commit
        required: true
        default: feature/subtitle-archive-import
        type: string
      build_artifact:
        description: Build and publish the subtitle preview IPA
        required: false
        default: true
        type: boolean
      run_tests:
        description: Run native archive checks and XCTest independently
        required: false
        default: true
        type: boolean
      test_scope:
        description: Full suite or subtitle and playback regressions
        required: false
        default: full
        type: choice
        options:
          - full
          - subtitle

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    if: ${{ inputs.build_artifact }}
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: subtitle-successful-ipa-release
      cancel-in-progress: false
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify subtitle source and toolchain
        working-directory: source
        run: |
          git merge-base --is-ancestor HEAD origin/feature/subtitle-archive-import
          xcodebuild -version
          xcrun swift --version
          brew install xcodegen cmake > "$RUNNER_TEMP/generator.log" 2>&1
          python3 -m unittest discover -s ../builder/tests
          xcodegen generate > "$RUNNER_TEMP/project.log" 2>&1
      - name: Prepare preview version
        working-directory: source
        env:
          APP_NAME: ${{ secrets.SOURCE_SCHEME }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          DESTINATION_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          RELEASE_SERIES: S
        run: |
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^" ]+)".*$/\1/p' project.yml | head -n 1)"
          test "$version" = "0.8.5"
          export MARKETING_VERSION="$version"
          BUILD_NUMBER="$(python3 "$GITHUB_WORKSPACE/builder/tools/release_number.py" resolve)"
          {
            echo "MARKETING_VERSION=$version"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "RELEASE_SERIES=S"
            echo "RELEASE_TAG=v${version}-S${BUILD_NUMBER}"
            echo "IPA_NAME=${APP_NAME}-v${version}-S${BUILD_NUMBER}.ipa"
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: Archive
        id: archive
        working-directory: source
        env:
          SOURCE_PROJECT: ${{ secrets.SOURCE_PROJECT }}
          SOURCE_SCHEME: ${{ secrets.SOURCE_SCHEME }}
        run: |
          xcodebuild archive \
            -project "$SOURCE_PROJECT" -scheme "$SOURCE_SCHEME" \
            -configuration Release -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            NEIRO_RELEASE_LABEL="${MARKETING_VERSION}-S${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1
      - name: Show archive diagnostics
        if: failure() && steps.archive.outcome == 'failure'
        run: |
          grep -E "error:|fatal error:|BUILD FAILED|Error |CMake Error" "$RUNNER_TEMP/archive.log" | tail -160 || true
      - name: Package IPA
        working-directory: source
        run: |
          mkdir -p build/Payload
          app_path="$(find build/App.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app_path"
          cp -R "$app_path" build/Payload/
          /usr/libexec/PlistBuddy -c "Print :NeiroReleaseLabel" "$app_path/Info.plist"
          (cd build && zip -qr "$IPA_NAME" Payload)
          test -s "build/$IPA_NAME"
      - name: Publish private preview
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          DESTINATION_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          APP_NAME: ${{ secrets.SOURCE_SCHEME }}
        run: |
          {
            echo "字幕导入预览版 ${MARKETING_VERSION}-S${BUILD_NUMBER}"
            echo
            echo "- ZIP、7z、RAR 本地字幕导入、RJ 作品关联与去重。"
            echo "- 播放器选择本地字幕、查看正文和原文、调整字幕偏移。"
            echo "- 构建与测试独立运行，本包发布仅代表 Archive 和 IPA 打包成功。"
            echo "- 源码提交：$SOURCE_COMMIT"
            echo "- 测试状态：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- 无密码、非分卷字幕包；真实设备体验仍需验证。"
          } > "$RUNNER_TEMP/release-body.md"
          export IPA_PATH="$GITHUB_WORKSPACE/source/build/$IPA_NAME"
          export NOTES_PATH="$RUNNER_TEMP/release-body.md"
          python3 "$GITHUB_WORKSPACE/builder/tools/release_number.py" publish

  test:
    if: ${{ inputs.run_tests }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify subtitle source and install tools
        working-directory: source
        run: |
          git merge-base --is-ancestor HEAD origin/feature/subtitle-archive-import
          xcodebuild -version
          brew install xcodegen cmake > "$RUNNER_TEMP/generator.log" 2>&1
      - name: Native archive regression
        id: native
        working-directory: source
        run: bash tools/test_archive_native.sh > "$RUNNER_TEMP/native-tests.log" 2>&1
      - name: XCTest
        id: xctest
        if: ${{ !cancelled() }}
        working-directory: source
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          filters=()
          case "$TEST_SCOPE" in
            full) ;;
            subtitle)
              for test_class in SubtitleArchiveReaderTests SubtitleLibraryStoreTests SubtitleMatchingTests SubtitleParserTests LyricsStoreTests TrackSelectionPolicyTests LyricsPresentationTests StorageAccountingTests StorageViewLogicTests TemporaryStorageCleanerTests; do
                filters+=("-only-testing:NeiroTests/$test_class")
              done
              ;;
            *) echo "Unknown test scope" >&2; exit 2 ;;
          esac
          bash tools/test_ios.sh "${filters[@]}" > "$RUNNER_TEMP/xctest.log" 2>&1
      - name: Test diagnostics
        if: always()
        run: |
          for log in "$RUNNER_TEMP/native-tests.log" "$RUNNER_TEMP/xctest.log"; do
            if [ -f "$log" ]; then
              grep -E "error:|fatal error:|CMake Error|Assertion|FAIL|Test Case .*failed" "$log" || true
              grep -E "PASS|Executed|TEST SUCCEEDED|Test Suite .*failed|passed;.*failed" "$log" | tail -90 || true
            fi
          done
          result_bundle="$(find source/build -maxdepth 1 -type d -name 'Tests-*.xcresult' | head -n 1)"
          if [ -n "$result_bundle" ]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" || true
          fi

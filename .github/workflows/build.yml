name: Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source revision
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref || 'main' }}
          path: source
          persist-credentials: false

      - name: Install build generator
        run: brew install xcodegen > "$RUNNER_TEMP/generator.log" 2>&1

      - name: Generate project
        working-directory: source
        run: xcodegen generate > "$RUNNER_TEMP/project.log" 2>&1

      - name: Archive
        working-directory: source
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SOURCE_PROJECT: ${{ secrets.SOURCE_PROJECT }}
          SOURCE_SCHEME: ${{ secrets.SOURCE_SCHEME }}
        run: |
          xcodebuild archive \
            -project "$SOURCE_PROJECT" \
            -scheme "$SOURCE_SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/archive.log" 2>&1

      - name: Package IPA
        working-directory: source
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          app_path="$(find build/App.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app_path"
          cp -R "$app_path" build/Payload/
          (cd build && zip -qr App-unsigned.ipa Payload)
          test -s build/App-unsigned.ipa
          echo "package=verified"

      - name: Publish private artifact
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          DESTINATION_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if ! gh release create "$tag" \
              "$GITHUB_WORKSPACE/source/build/App-unsigned.ipa" \
              --repo "$DESTINATION_REPOSITORY" \
              --target "$SOURCE_REF" \
              --title "Build ${GITHUB_RUN_NUMBER}" \
              --notes "Automated unsigned build." \
              > "$RUNNER_TEMP/publish.log" 2>&1; then
            echo "private_artifact=failed"
            exit 1
          fi
          echo "private_artifact=published"

name: Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Subtitle source branch or exact commit
        required: true
        default: feature/subtitle-archive-import
        type: string
      build_artifact:
        description: Build and publish the subtitle preview IPA
        required: false
        default: true
        type: boolean
      run_tests:
        description: Run native archive checks and XCTest independently
        required: false
        default: true
        type: boolean
      test_scope:
        description: Full suite or focused subtitle playback, import, store, and browse regressions
        required: false
        default: full
        type: choice
        options:
          - full
          - subtitle
          - subtitle_store
          - subtitle_browse
          - subtitle_import
          - subtitle_lookup
      run_picker_tests:
        description: Touch the real iOS Files picker with synthetic local archives
        required: false
        default: false
        type: boolean
      run_subtitle_ui_tests:
        description: Exercise subtitle folders, reading controls, and preview dismissal with synthetic data
        required: false
        default: false
        type: boolean
      subtitle_ui_filter:
        description: SubtitleLibraryTouchTests class or one method within that class
        required: false
        default: NeiroInteractionUITests/SubtitleLibraryTouchTests
        type: string

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    if: ${{ inputs.build_artifact }}
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: subtitle-successful-ipa-release
      cancel-in-progress: false
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify subtitle source and toolchain
        working-directory: source
        run: |
          git merge-base --is-ancestor HEAD origin/feature/subtitle-archive-import
          xcodebuild -version
          xcrun swift --version
          brew install xcodegen cmake > "$RUNNER_TEMP/generator.log" 2>&1
          python3 -m unittest discover -s ../builder/tests
          xcodegen generate > "$RUNNER_TEMP/project.log" 2>&1
      - name: Prepare preview version
        working-directory: source
        env:
          APP_NAME: ${{ secrets.SOURCE_SCHEME }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          DESTINATION_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          RELEASE_SERIES: S
        run: |
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^" ]+)".*$/\1/p' project.yml | head -n 1)"
          test "$version" = "0.8.5"
          export MARKETING_VERSION="$version"
          BUILD_NUMBER="$(python3 "$GITHUB_WORKSPACE/builder/tools/release_number.py" resolve)"
          {
            echo "MARKETING_VERSION=$version"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "RELEASE_SERIES=S"
            echo "RELEASE_TAG=v${version}-S${BUILD_NUMBER}"
            echo "IPA_NAME=${APP_NAME}-v${version}-S${BUILD_NUMBER}.ipa"
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
      - name: Archive
        id: archive
        working-directory: source
        env:
          SOURCE_PROJECT: ${{ secrets.SOURCE_PROJECT }}
          SOURCE_SCHEME: ${{ secrets.SOURCE_SCHEME }}
        run: |
          xcodebuild archive \
            -project "$SOURCE_PROJECT" -scheme "$SOURCE_SCHEME" \
            -configuration Release -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            NEIRO_RELEASE_LABEL="${MARKETING_VERSION}-S${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/archive.log" 2>&1
      - name: Show archive diagnostics
        if: failure() && steps.archive.outcome == 'failure'
        run: |
          grep -E "error:|fatal error:|BUILD FAILED|Error |CMake Error" "$RUNNER_TEMP/archive.log" | tail -160 || true
      - name: Package IPA
        working-directory: source
        run: |
          mkdir -p build/Payload
          app_path="$(find build/App.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app_path"
          cp -R "$app_path" build/Payload/
          /usr/libexec/PlistBuddy -c "Print :NeiroReleaseLabel" "$app_path/Info.plist"
          (cd build && zip -qr "$IPA_NAME" Payload)
          test -s "build/$IPA_NAME"
      - name: Publish private preview
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          DESTINATION_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          APP_NAME: ${{ secrets.SOURCE_SCHEME }}
        run: |
          {
            echo "字幕导入预览版 ${MARKETING_VERSION}-S${BUILD_NUMBER}"
            echo
            echo "- ZIP、7z、RAR 本地字幕导入、RJ 作品关联与去重。"
            echo "- 播放器选择本地字幕、查看正文和原文、调整字幕偏移。"
            echo "- 构建与测试独立运行，本包发布仅代表 Archive 和 IPA 打包成功。"
            echo "- 源码提交：$SOURCE_COMMIT"
            echo "- 测试状态：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- 无密码、非分卷字幕包；真实设备体验仍需验证。"
          } > "$RUNNER_TEMP/release-body.md"
          export IPA_PATH="$GITHUB_WORKSPACE/source/build/$IPA_NAME"
          export NOTES_PATH="$RUNNER_TEMP/release-body.md"
          python3 "$GITHUB_WORKSPACE/builder/tools/release_number.py" publish

  test:
    if: ${{ inputs.run_tests }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify subtitle source and install tools
        working-directory: source
        run: |
          git merge-base --is-ancestor HEAD origin/feature/subtitle-archive-import
          xcodebuild -version
          brew install xcodegen cmake > "$RUNNER_TEMP/generator.log" 2>&1
      - name: Native archive regression
        id: native
        if: ${{ inputs.test_scope == 'full' || inputs.test_scope == 'subtitle' || inputs.test_scope == 'subtitle_import' }}
        working-directory: source
        run: bash tools/test_archive_native.sh > "$RUNNER_TEMP/native-tests.log" 2>&1
      - name: XCTest
        id: xctest
        if: ${{ !cancelled() }}
        working-directory: source
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          filters=()
          case "$TEST_SCOPE" in
            full) ;;
            subtitle)
              for test_class in SubtitleArchiveReaderTests SubtitleLibraryStoreTests SubtitleLibraryBrowseTests SubtitleImportNoticeTests SubtitleWorkLookupTests SubtitleWorkManagementTests APIClientRoutingTests SubtitleMatchingTests SubtitleParserTests LyricsStoreTests TrackSelectionPolicyTests LyricsPresentationTests StorageAccountingTests StorageViewLogicTests TemporaryStorageCleanerTests ArtworkPaletteTests ListeningStatisticsRuntimeFixTests; do
                filters+=("-only-testing:NeiroTests/$test_class")
              done
              ;;
            subtitle_store)
              filters+=("-only-testing:NeiroTests/SubtitleLibraryStoreTests")
              ;;
            subtitle_browse)
              for test_class in SubtitleLibraryStoreTests SubtitleLibraryBrowseTests SubtitleMatchingTests LyricsStoreTests; do
                filters+=("-only-testing:NeiroTests/$test_class")
              done
              filters+=("-only-testing:NeiroTests/ListeningStatisticsRuntimeFixTests/testRowInteractionDecisionPureFunction")
              filters+=("-only-testing:NeiroTests/ListeningStatisticsRuntimeFixTests/testDeleteHitDecisionPureFunction")
              ;;
            subtitle_import)
              for test_class in SubtitleArchiveReaderTests SubtitleLibraryStoreTests SubtitleLibraryBrowseTests SubtitleImportNoticeTests SubtitleWorkLookupTests SubtitleWorkManagementTests APIClientRoutingTests SubtitleParserTests; do
                filters+=("-only-testing:NeiroTests/$test_class")
              done
              ;;
            subtitle_lookup)
              for test_class in APIClientRoutingTests SubtitleWorkLookupTests; do
                filters+=("-only-testing:NeiroTests/$test_class")
              done
              for test_method in testImportCoordinatorContinuesAfterPresentingTaskIsCancelled testImportCoordinatorCancellationBeforeCommitLeavesLibraryUnchanged testImportCoordinatorCancellationDuringLookupPreservesImportAndAllowsNextTask; do
                filters+=("-only-testing:NeiroTests/SubtitleLibraryStoreTests/$test_method")
              done
              ;;
            *) echo "Unknown test scope" >&2; exit 2 ;;
          esac
          bash tools/test_ios.sh "${filters[@]}" > "$RUNNER_TEMP/xctest.log" 2>&1
      - name: Test diagnostics
        if: always()
        run: |
          for log in "$RUNNER_TEMP/native-tests.log" "$RUNNER_TEMP/xctest.log"; do
            if [ -f "$log" ]; then
              grep -E "error:|fatal error:|CMake Error|Assertion|FAIL|Test Case .*failed" "$log" || true
              grep -E "PASS|Executed|TEST SUCCEEDED|Test Suite .*failed|passed;.*failed|SUBTITLE_SCALE" "$log" | tail -90 || true
            fi
          done
          result_bundle="$(find source/build -maxdepth 1 -type d -name 'Tests-*.xcresult' | head -n 1)"
          if [ -n "$result_bundle" ]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" || true
          fi

      - name: Export native artwork palette evidence
        if: always()
        working-directory: source
        run: |
          result_bundle="$(find build -maxdepth 1 -type d -name 'Tests-*.xcresult' | head -n 1)"
          if [ -z "$result_bundle" ]; then
            echo "No XCTest result bundle was produced."
            exit 0
          fi
          xcrun xcresulttool export attachments --path "$result_bundle" --output-path build/XCTestAttachments
          python3 - <<'PY'
          from pathlib import Path
          import json
          import shutil

          root = Path("build/XCTestAttachments")
          output = Path("build/ArtworkPaletteEvidence")
          selected = []
          for test in json.loads((root / "manifest.json").read_text(encoding="utf-8")):
              for attachment in test.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "")
                  if name.startswith("ArtworkPalette-") and name.endswith(".png"):
                      output.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(root / attachment["exportedFileName"], output / Path(name).name)
                      selected.append(attachment)
          if selected:
              (output / "manifest.json").write_text(json.dumps(selected, indent=2), encoding="utf-8")
          print(f"Exported {len(selected)} native artwork palette images.")
          PY

      - name: Upload native artwork palette evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Artwork-Palette-Evidence
          path: source/build/ArtworkPaletteEvidence
          if-no-files-found: ignore

  subtitle_ui:
    if: ${{ inputs.run_subtitle_ui_tests }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify subtitle source and install tools
        working-directory: source
        run: |
          git merge-base --is-ancestor HEAD origin/feature/subtitle-archive-import
          xcodebuild -version
          brew install xcodegen cmake > "$RUNNER_TEMP/generator.log" 2>&1
      - name: Select latest available iOS simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/subtitle-ui-devices.json"
          python3 - "$RUNNER_TEMP/subtitle-ui-devices.json" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys

          candidates = []
          for runtime, devices in json.load(open(sys.argv[1], encoding="utf-8"))["devices"].items():
              match = re.search(r"(?:^|\.)iOS-(\d+(?:-\d+)*)", runtime)
              if match is None:
                  continue
              version = tuple(int(part) for part in match[1].split("-"))
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device.get("state") == "Booted", device))
          if not candidates:
              raise SystemExit("No available iPhone simulator was found.")
          version, _, device = max(candidates, key=lambda item: (item[0], item[1]))
          with open(sys.argv[2], "a", encoding="utf-8") as environment:
              environment.write(f"TEST_DESTINATION=platform=iOS Simulator,id={device['udid']}\n")
          print(f"Subtitle UI simulator: {device['name']}, iOS {'.'.join(map(str, version))}, {device['udid']}")
          PY
      - name: Subtitle UI regressions
        working-directory: source
        env:
          SUBTITLE_UI_FILTER: ${{ inputs.subtitle_ui_filter }}
        run: |
          if [[ ! "$SUBTITLE_UI_FILTER" =~ ^NeiroInteractionUITests/SubtitleLibraryTouchTests(/test[A-Za-z0-9_]+)?$ ]]; then
            echo "Invalid subtitle UI filter: expected SubtitleLibraryTouchTests or one of its test methods." >&2
            exit 2
          fi
          bash tools/test_work_menu_smoke.sh "$SUBTITLE_UI_FILTER" > "$RUNNER_TEMP/subtitle-ui-tests.log" 2>&1
      - name: Export subtitle UI diagnostics and screenshots
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/subtitle-ui-tests.log" ]; then
            grep -E "error:|fatal error:|Assertion|FAIL|Test Case .*failed|Executed|TEST SUCCEEDED" "$RUNNER_TEMP/subtitle-ui-tests.log" || true
            cp "$RUNNER_TEMP/subtitle-ui-tests.log" source/build/SubtitleUI-tests.log
          fi
          result_bundle="source/build/WorkMenuSmoke.xcresult"
          if [ -d "$result_bundle" ]; then
            xcrun xcresulttool get test-results summary --path "$result_bundle" > source/build/SubtitleUI-summary.json
            cat source/build/SubtitleUI-summary.json
            xcrun xcresulttool export attachments --path "$result_bundle" --output-path source/build/SubtitleUIAttachments
          fi
      - name: Upload subtitle UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-UI-Evidence
          path: |
            source/build/SubtitleUIAttachments
            source/build/SubtitleUI-summary.json
            source/build/SubtitleUI-tests.log
          if-no-files-found: warn

  picker:
    if: ${{ inputs.run_picker_tests }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify subtitle source and install tools
        working-directory: source
        run: |
          git merge-base --is-ancestor HEAD origin/feature/subtitle-archive-import
          xcodebuild -version
          brew install xcodegen cmake > "$RUNNER_TEMP/generator.log" 2>&1
      - name: Real Files picker touch regression
        id: picker
        working-directory: source
        run: bash tools/test_subtitle_picker.sh > "$RUNNER_TEMP/picker-tests.log" 2>&1
      - name: Picker diagnostics and synthetic screenshots
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/picker-tests.log" ]; then
            grep -E "error:|fatal error:|CMake Error|Assertion|FAIL|Test Case .*failed|SUBTITLE_PICKER|picker_fixture|Executed|TEST SUCCEEDED" "$RUNNER_TEMP/picker-tests.log" || true
            tail -50 "$RUNNER_TEMP/picker-tests.log"
          fi
          if [ -d source/build/WorkMenuSmoke.xcresult ]; then
            xcrun xcresulttool get test-results summary --path source/build/WorkMenuSmoke.xcresult || true
            if [ ! -d source/build/SubtitlePickerAttachments ]; then
              xcrun xcresulttool export attachments --path source/build/WorkMenuSmoke.xcresult --output-path source/build/SubtitlePickerAttachments || true
            fi
          fi
      - name: Upload synthetic picker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Subtitle-Picker-Evidence
          path: |
            source/build/SubtitlePickerAttachments
            source/build/SubtitlePicker-last-screen.png
            source/build/SubtitlePicker-summary.json
            source/build/SubtitlePicker-fixture.json
            source/build/SubtitlePicker-files-launch.log
            source/build/SubtitlePicker-group-direct.log
            source/build/SubtitlePicker-group-metadata.json
          if-no-files-found: ignore

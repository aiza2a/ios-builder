name: Cross-repository iOS build test

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source repository branch or commit
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: aiza2a/Neiro
          ref: ${{ inputs.source_ref || 'main' }}
          path: source
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: source
        run: xcodegen generate

      - name: Archive unsigned IPA payload
        working-directory: source
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild archive \
            -project Neiro.xcodeproj \
            -scheme Neiro \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Neiro.xcarchive \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Verify archive
        working-directory: source
        run: test -d build/Neiro.xcarchive

name: Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source revision
        required: false
        default: fix/ui-aesthetic-round2
        type: string
      run_tests:
        description: Run targeted regression tests before compiling
        required: false
        default: false
        type: boolean
      run_interaction_tests:
        description: Include touch interaction tests
        required: false
        default: false
        type: boolean
      regression_scope:
        description: Select the requested regression test group
        required: false
        default: ui
        type: choice
        options:
          - ui
          - listening-player
      build_artifact:
        description: Compile, package and publish an IPA
        required: false
        default: true
        type: boolean
      run_work_menu_smoke:
        description: Verify work-card taps and native context menus
        required: false
        default: false
        type: boolean
      work_menu_test_filter:
        description: XCTest identifier for the requested touch checks
        required: false
        default: NeiroInteractionUITests/WorkMenuTouchTests
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    # All adopting branches share one release lane. Test-only runs remain independent.
    concurrency:
      group: ${{ inputs.build_artifact && 'successful-ipa-release' || format('tests-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
        with:
          path: builder
          persist-credentials: false

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          ref: ${{ inputs.source_ref || 'fix/ui-aesthetic-round2' }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Install build generator
        run: brew install xcodegen > "$RUNNER_TEMP/generator.log" 2>&1

      - name: Generate project
        working-directory: source
        run: xcodegen generate > "$RUNNER_TEMP/project.log" 2>&1

      - name: Prepare release metadata
        if: ${{ inputs.build_artifact }}
        working-directory: source
        env:
          APP_NAME: ${{ secrets.SOURCE_SCHEME }}
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          DESTINATION_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref || 'fix/ui-aesthetic-round2' }}
        run: |
          version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^" ]+)"?.*$/\1/p' project.yml | head -n 1)"
          test -n "$version"
          export MARKETING_VERSION="$version"
          BUILD_NUMBER="$(python3 "$GITHUB_WORKSPACE/builder/tools/release_number.py" resolve)"
          source_commit="$(git rev-parse HEAD)"
          release_tag="v${version}-${BUILD_NUMBER}"
          ipa_name="${APP_NAME}-${release_tag}.ipa"

          {
            echo "MARKETING_VERSION=$version"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "RELEASE_TAG=$release_tag"
            echo "IPA_NAME=$ipa_name"
            echo "SOURCE_COMMIT=$source_commit"
            echo "SOURCE_REF=$SOURCE_REF"
          } >> "$GITHUB_ENV"

          if [ -s RELEASE_NOTES_ZH.md ]; then
            cp RELEASE_NOTES_ZH.md "$RUNNER_TEMP/release-notes.md"
          else
            {
              echo "## 本次修改"
              echo "- 未提供 RELEASE_NOTES_ZH.md，以下内容根据源码提交自动整理。"
              echo
              echo "### 提交摘要"
              last_tag="$(git tag --list 'v*-*' --sort=-version:refname | head -n 1)"
              if [ -z "$last_tag" ]; then
                last_tag="$(git tag --list 'build-*' --sort=-version:refname | head -n 1)"
              fi
              if [ -n "$last_tag" ] && git rev-parse "$last_tag" >/dev/null 2>&1; then
                git log --no-merges --format='- %s (%h)' "$last_tag..HEAD"
                echo
                echo "### 变更文件"
                git diff --stat "$last_tag..HEAD"
              else
                git log --no-merges -n 20 --format='- %s (%h)'
                echo
                echo "### 最近提交变更文件"
                git show --stat --oneline --summary HEAD
              fi
            } > "$RUNNER_TEMP/release-notes.md"
          fi
          echo "metadata=verified"

      - name: Verify Xcode 26 toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          test -d "$DEVELOPER_DIR"

      - name: UI and sorting regressions
        if: ${{ inputs.run_tests || inputs.run_interaction_tests }}
        working-directory: source
        env:
          RUN_INTERACTION_TESTS: ${{ inputs.run_interaction_tests && '1' || '0' }}
          REGRESSION_SCOPE: ${{ inputs.regression_scope || 'ui' }}
        run: bash tools/test_ui_regressions.sh > "$RUNNER_TEMP/ui-tests.log" 2>&1

      - name: Show regression diagnostics
        if: ${{ always() && (inputs.run_tests || inputs.run_interaction_tests) }}
        run: |
          if [ -f "$RUNNER_TEMP/ui-tests.log" ]; then
            grep -E "error:|failed|TEST FAILED" "$RUNNER_TEMP/ui-tests.log" || true
            grep -E "Executed|TEST SUCCEEDED" "$RUNNER_TEMP/ui-tests.log" | tail -30 || true
          fi

      - name: Upload UI regression results
        if: ${{ always() && (inputs.run_tests || inputs.run_interaction_tests) }}
        uses: actions/upload-artifact@v4
        with:
          name: UI-Regression-Results
          path: |
            source/build/UIRegression-*.xcresult
            ${{ runner.temp }}/ui-tests.log
          if-no-files-found: ignore

      - name: Work menu touch smoke
        if: ${{ inputs.run_work_menu_smoke }}
        working-directory: source
        env:
          WORK_MENU_TEST_FILTER: ${{ inputs.work_menu_test_filter }}
        run: bash tools/test_work_menu_smoke.sh "$WORK_MENU_TEST_FILTER" > "$RUNNER_TEMP/work-menu-smoke.log" 2>&1

      - name: Show work menu diagnostics
        if: ${{ always() && inputs.run_work_menu_smoke }}
        run: |
          if [ -f "$RUNNER_TEMP/work-menu-smoke.log" ]; then
            grep -E "error:|failed|TEST FAILED|Executed|TEST SUCCEEDED" "$RUNNER_TEMP/work-menu-smoke.log" | tail -80 || true
          fi

      - name: Upload work menu results
        if: ${{ always() && inputs.run_work_menu_smoke }}
        uses: actions/upload-artifact@v4
        with:
          name: Work-Menu-Smoke
          path: |
            source/build/WorkMenuSmoke*.xcresult
            ${{ runner.temp }}/work-menu-smoke.log
          if-no-files-found: warn

      - name: Archive
        if: ${{ inputs.build_artifact }}
        id: archive
        working-directory: source
        env:
          SOURCE_PROJECT: ${{ secrets.SOURCE_PROJECT }}
          SOURCE_SCHEME: ${{ secrets.SOURCE_SCHEME }}
        run: |
          xcodebuild archive \
            -project "$SOURCE_PROJECT" \
            -scheme "$SOURCE_SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/archive.log" 2>&1

      - name: Show archive diagnostics on failure
        if: failure() && steps.archive.outcome == 'failure'
        working-directory: source
        run: |
          echo "archive=failed"
          grep -E "error:|fatal error:|BUILD FAILED|SwiftCompile|CompileSwift" "$RUNNER_TEMP/archive.log" | tail -200 || true

      - name: Package IPA
        if: ${{ inputs.build_artifact }}
        working-directory: source
        run: |
          rm -rf build/Payload
          mkdir -p build/Payload
          app_path="$(find build/App.xcarchive/Products/Applications -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$app_path"
          cp -R "$app_path" build/Payload/
          (cd build && zip -qr "$IPA_NAME" Payload)
          test -s "build/$IPA_NAME"
          echo "package=verified"

      - name: Publish private artifact
        if: ${{ inputs.build_artifact }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_WRITE_TOKEN }}
          DESTINATION_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          APP_NAME: ${{ secrets.SOURCE_SCHEME }}
          RUN_REGRESSION_TESTS: ${{ inputs.run_tests }}
          RUN_WORK_MENU_SMOKE: ${{ inputs.run_work_menu_smoke }}
        run: |
          {
            cat "$RUNNER_TEMP/release-notes.md"
            echo
            echo "## 构建信息"
            echo "- 应用版本：$MARKETING_VERSION"
            echo "- 构建编号：$BUILD_NUMBER"
            echo "- 源码提交：$SOURCE_COMMIT"
            echo "- 源码版本：$SOURCE_REF"
            echo
            echo "## 验证结果"
            echo "- 私有源码读取：通过"
            echo "- Xcode 工程生成：通过"
            echo "- Archive 编译：通过"
            if [ "$RUN_REGRESSION_TESTS" = true ]; then
              echo "- 专项测试：通过"
            else
              echo "- 专项测试：按本次选择未执行"
            fi
            echo "- IPA 打包：通过"
            if [ "$RUN_WORK_MENU_SMOKE" = true ]; then
              echo "- 作品点击与原生长按触摸检查：通过"
            fi
            echo "- 私有 Release 发布：通过"
            echo
            echo "## 产物"
            echo "- $IPA_NAME"
          } > "$RUNNER_TEMP/release-body.md"

          export IPA_PATH="$GITHUB_WORKSPACE/source/build/$IPA_NAME"
          export NOTES_PATH="$RUNNER_TEMP/release-body.md"
          python3 "$GITHUB_WORKSPACE/builder/tools/release_number.py" publish
